schemaVersion: 1

mirrors:
  dl: https://dl.svc.plus
  cn_dl: https://cn-dl.svc.plus
  repo: https://repo.svc.plus
  cn_repo: https://cn-repo.svc.plus
  github: https://github.com
  regions:
    global:
      label: Global (Cloudflare R2)
      dl: https://dl.svc.plus
      repo: https://repo.svc.plus
      homebrew_tap_repo: ai-workspace-lab/homebrew-tap
      homebrew_tap_url: https://github.com/ai-workspace-lab/homebrew-tap.git
      homebrew_tap_http: https://repo.svc.plus/homebrew/tap.git
      scoop_bucket_repo: ai-workspace-lab/scoop-bucket
      scoop_bucket_url: https://github.com/ai-workspace-lab/scoop-bucket.git
      scoop_bucket_http: https://repo.svc.plus/scoop/bucket.git
      storage:
        provider: cloudflare-r2
        bucket: svc-plus-repo-global
    cn:
      label: China / HK (Aliyun OSS)
      dl: https://cn-dl.svc.plus
      repo: https://cn-repo.svc.plus
      homebrew_tap_repo: ai-workspace-lab/homebrew-tap
      homebrew_tap_url: https://cn-repo.svc.plus/homebrew/tap.git
      homebrew_tap_http: https://cn-repo.svc.plus/homebrew/tap.git
      scoop_bucket_repo: ai-workspace-lab/scoop-bucket
      scoop_bucket_url: https://cn-repo.svc.plus/scoop/bucket.git
      scoop_bucket_http: https://cn-repo.svc.plus/scoop/bucket.git
      storage:
        provider: aliyun-oss
        bucket: svc-plus-repo-cn-hk

products:
  xconnect:
    id: xconnect
    name: XConnect-APP
    aliases:
      - xconnect-app
    category: desktop/mobile
    repo: ai-workspace-xstream/xconnect-app
    homepage: https://github.com/ai-workspace-xstream/xconnect-app
    summary: Cross-platform secure connectivity and workspace client
    publisher: svc.plus
    license: Apache-2.0
    default_channel: latest
    channels:
      - stable
      - latest
    platforms:
      - macos
      - windows
      - linux
      - android
      - ios
    release_matrix_url: https://dl.svc.plus/releases/xconnect/release-matrix.json
    cn_release_matrix_url: https://cn-dl.svc.plus/releases/xconnect/release-matrix.json
    packages:
      deb:
        package_name: xconnect
        architectures:
          - amd64
          - arm64
        components:
          - main
        asset_patterns:
          - xconnect-linux-amd64.deb
          - xconnect-linux-arm64.deb
          - xconnect_*_amd64.deb
          - xconnect_*_arm64.deb
      rpm:
        package_name: xconnect
        architectures:
          - x86_64
          - aarch64
        asset_patterns:
          - xconnect-linux-x86_64.rpm
          - xconnect-linux-aarch64.rpm
          - xconnect-*.x86_64.rpm
          - xconnect-*.aarch64.rpm
      homebrew:
        tap: ai-workspace-lab/homebrew-tap
        tap_alias: svc-plus/tap
        cask_name: xconnect
        app_name: XConnect.app
        asset_patterns:
          - xconnect.dmg
          - xconnect-release-*.dmg
        zap:
          - ~/Library/Application Support/plus.svc.xconnect
          - ~/Library/Caches/plus.svc.xconnect
          - ~/Library/Preferences/plus.svc.xconnect.plist
          - ~/Library/Saved Application State/plus.svc.xconnect.savedState
      scoop:
        bucket: ai-workspace-lab/scoop-bucket
        bucket_alias: svc-plus
        manifest_name: xconnect
        asset_patterns:
          - xconnect-windows.zip
          - xconnect-windows-portable.exe
        bin:
          - xconnect.exe
        shortcuts:
          - - xconnect.exe
            - XConnect
      winget:
        identifier: SvcPlus.XConnect
        moniker: xconnect
        publisher: svc.plus
        installer_type: msi
        asset_patterns:
          - xconnect-windows.msi
          - xconnect-windows-portable.exe
      direct:
        macos:
          dmg:
            - xconnect.dmg
            - xconnect-release-*.dmg
        windows:
          msi:
            - xconnect-windows.msi
          exe:
            - xconnect-windows-portable.exe
          zip:
            - xconnect-windows.zip
        linux:
          deb:
            - xconnect-linux-amd64.deb
          rpm:
            - xconnect-linux-x86_64.rpm
          appimage:
            - xconnect-linux.AppImage
          tar.gz:
            - xconnect-linux-x64.tar.gz
          zip:
            - xconnect-linux.zip
        android:
          apk:
            - app-release.apk
        ios:
          ipa:
            - xconnect.ipa

  xworkmate:
    id: xworkmate
    name: XWorkmate
    category: desktop/mobile
    repo: ai-workspace-lab/xworkmate-app
    homepage: https://github.com/ai-workspace-lab/xworkmate-app
    summary: Desktop-first AI workspace shell
    publisher: ai-workspace-lab
    license: Apache-2.0
    default_channel: stable
    channels:
      - stable
      - latest
    platforms:
      - macos
      - windows
      - linux
      - android
    release_matrix_url: https://dl.svc.plus/releases/xworkmate/release-matrix.json
    cn_release_matrix_url: https://cn-dl.svc.plus/releases/xworkmate/release-matrix.json
    packages:
      deb:
        package_name: xworkmate
        architectures:
          - amd64
          - arm64
        components:
          - main
        asset_patterns:
          - xworkmate_*_amd64.deb
          - xworkmate-linux-amd64.deb
          - xworkmate_*_arm64.deb
          - xworkmate-linux-arm64.deb
      rpm:
        package_name: xworkmate
        architectures:
          - x86_64
          - aarch64
        asset_patterns:
          - xworkmate-*.x86_64.rpm
          - xworkmate-linux-x86_64.rpm
          - xworkmate-*.aarch64.rpm
          - xworkmate-linux-aarch64.rpm
      homebrew:
        tap: ai-workspace-lab/homebrew-tap
        tap_alias: svc-plus/tap
        cask_name: xworkmate
        app_name: XWorkmate.app
        asset_patterns:
          - XWorkmate-*.dmg
          - xworkmate*.dmg
        zap:
          - ~/Library/Application Support/plus.svc.xworkmate
          - ~/Library/Caches/plus.svc.xworkmate
          - ~/Library/Preferences/plus.svc.xworkmate.plist
          - ~/Library/Saved Application State/plus.svc.xworkmate.savedState
      scoop:
        bucket: ai-workspace-lab/scoop-bucket
        bucket_alias: svc-plus
        manifest_name: xworkmate
        asset_patterns:
          - xworkmate-windows-amd64.zip
          - xworkmate-windows.zip
          - xworkmate-windows-portable.exe
        bin:
          - xworkmate.exe
        shortcuts:
          - - xworkmate.exe
            - XWorkmate
      winget:
        identifier: SvcPlus.XWorkmate
        moniker: xworkmate
        publisher: ai-workspace-lab
        installer_type: msi
        asset_patterns:
          - xworkmate-windows*.msi
          - xworkmate-windows*.exe
      direct:
        macos:
          dmg:
            - XWorkmate-*.dmg
            - xworkmate*.dmg
        windows:
          zip:
            - xworkmate-windows-amd64.zip
          msi:
            - xworkmate-windows*.msi
          exe:
            - xworkmate-windows*.exe
        linux:
          deb:
            - xworkmate_*_amd64.deb
          rpm:
            - xworkmate-*.x86_64.rpm
        android:
          apk:
            - xworkmate-android-arm64.apk

  xconnect-one:
    id: xconnect-one
    name: XConnect-One
    category: cli/desktop
    repo: ai-workspace-xstream/xconnect-one
    homepage: https://github.com/ai-workspace-xstream/xconnect-one
    summary: Unified AI workspace CLI, desktop app, and zero-lab runtime
    publisher: svc.plus
    license: Apache-2.0
    default_channel: latest
    channels:
      - stable
      - latest
    platforms:
      - macos
      - windows
      - linux
    release_matrix_url: https://dl.svc.plus/releases/xconnect-one/release-matrix.json
    cn_release_matrix_url: https://cn-dl.svc.plus/releases/xconnect-one/release-matrix.json
    packages:
      deb:
        package_name: xconnect-one
        architectures:
          - amd64
          - arm64
        components:
          - main
        asset_patterns:
          - xconnect-one_*_amd64.deb
          - xconnect-one_*_arm64.deb
      rpm:
        package_name: xconnect-one
        architectures:
          - x86_64
          - aarch64
        asset_patterns:
          - xconnect-one-*.x86_64.rpm
          - xconnect-one-*.aarch64.rpm
      homebrew:
        tap: ai-workspace-lab/homebrew-tap
        tap_alias: svc-plus/tap
        cask_name: xconnect-one
        app_name: XConnect-One.app
        asset_patterns:
          - xconnect-one-macos-arm64.dmg
          - xconnect-one-macos-amd64.dmg
      scoop:
        bucket: ai-workspace-lab/scoop-bucket
        bucket_alias: svc-plus
        manifest_name: xconnect-one
        asset_patterns:
          - xconnect-one-windows-amd64.zip
          - xconnect-one-windows-amd64.exe
        bin:
          - xconnect-one.exe
      direct:
        macos:
          dmg:
            - xconnect-one-macos-arm64.dmg
            - xconnect-one-macos-amd64.dmg
        windows:
          zip:
            - xconnect-one-windows-amd64.zip
          exe:
            - xconnect-one-windows-amd64.exe
        linux:
          deb:
            - xconnect-one_*_amd64.deb
            - xconnect-one_*_arm64.deb
          rpm:
            - xconnect-one-*.x86_64.rpm
            - xconnect-one-*.aarch64.rpm
          tar.gz:
            - xconnect-one-linux-amd64.tar.gz
            - xconnect-one-linux-arm64.tar.gz

  xconnect-gateway:
    id: xconnect-gateway
    name: XConnect Gateway
    category: server/cli
    repo: ai-workspace-xstream/xconnect-gateway
    homepage: https://github.com/ai-workspace-xstream/xconnect-gateway
    summary: High-performance XConnect edge gateway service
    publisher: svc.plus
    license: Apache-2.0
    default_channel: latest
    channels:
      - stable
      - latest
    platforms:
      - linux
    release_matrix_url: https://dl.svc.plus/releases/xconnect-gateway/release-matrix.json
    cn_release_matrix_url: https://cn-dl.svc.plus/releases/xconnect-gateway/release-matrix.json
    packages:
      direct:
        linux:
          binary:
            - xconnect-gateway-linux-amd64
            - xconnect-gateway-linux-arm64

  xconnect-edge-agent:
    id: xconnect-edge-agent
    name: XConnect Edge Agent
    category: server/agent
    repo: ai-workspace-xstream/xconnect-edge-agent
    homepage: https://github.com/ai-workspace-xstream/xconnect-edge-agent
    summary: Edge node runtime and Caddy control agent for XConnect
    publisher: svc.plus
    license: Apache-2.0
    default_channel: latest
    channels:
      - stable
      - latest
    platforms:
      - linux
    release_matrix_url: https://dl.svc.plus/releases/xconnect-edge-agent/release-matrix.json
    cn_release_matrix_url: https://cn-dl.svc.plus/releases/xconnect-edge-agent/release-matrix.json
    packages:
      direct:
        linux:
          binary:
            - xconnect-edge-agent-linux-amd64
            - xconnect-edge-agent-linux-arm64
          tar.gz:
            - artifact-amd64-*.tar.gz
            - artifact-arm64-*.tar.gz

  fluxgate:
    id: fluxgate
    name: Fluxgate
    category: server/cli
    repo: ai-workspace-xstream/fluxgate
    homepage: https://github.com/ai-workspace-xstream/fluxgate
    summary: Rust-based edge traffic gateway and proxy router
    publisher: svc.plus
    license: Apache-2.0
    default_channel: latest
    channels:
      - stable
      - latest
    platforms:
      - linux
    release_matrix_url: https://dl.svc.plus/releases/fluxgate/release-matrix.json
    cn_release_matrix_url: https://cn-dl.svc.plus/releases/fluxgate/release-matrix.json
    packages:
      direct:
        linux:
          binary:
            - fluxgate-linux-amd64
            - fluxgate-linux-arm64

  xworkmate-remote-desktop:
    id: xworkmate-remote-desktop
    name: XWorkmate Remote Desktop
    category: desktop/agent
    repo: ai-desktop-lab/xworkmate-remote-desktop
    homepage: https://github.com/ai-desktop-lab/xworkmate-remote-desktop
    summary: Cross-platform remote desktop agent and WebRTC bridge for XWorkmate
    publisher: ai-desktop-lab
    license: Apache-2.0
    default_channel: latest
    channels:
      - stable
      - latest
    platforms:
      - macos
      - windows
      - linux
    release_matrix_url: https://dl.svc.plus/releases/xworkmate-remote-desktop/release-matrix.json
    cn_release_matrix_url: https://cn-dl.svc.plus/releases/xworkmate-remote-desktop/release-matrix.json
    packages:
      direct:
        macos:
          binary:
            - xworkmate-remote-desktop-macos-arm64
            - xworkmate-remote-desktop-macos-amd64
        windows:
          exe:
            - xworkmate-remote-desktop-windows-amd64.exe
        linux:
          binary:
            - xworkmate-remote-desktop-linux-amd64
            - xworkmate-remote-desktop-linux-arm64
