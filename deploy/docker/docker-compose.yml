services:
  distd:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - distd-data:/var/lib/distd
    environment:
      - HARBOR_URL=${HARBOR_URL:-}
      - HARBOR_USER=${HARBOR_USER:-}
      - HARBOR_PASSWORD=${HARBOR_PASSWORD:-}
      - R2_ENDPOINT=${R2_ENDPOINT:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
      - GPG_PRIVATE_KEY=${GPG_PRIVATE_KEY:-}
      - OBS_USER=${OBS_USER:-}
      - OBS_PASSWORD=${OBS_PASSWORD:-}

  # Optional rsync read-only mirror sidecar sharing the exact same storage volume
  rsyncd:
    image: alpine:3.21
    profiles: ["rsync"]
    ports:
      - "873:873"
    volumes:
      - distd-data:/var/lib/distd:ro
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache rsync >/dev/null
        cat <<'EOF' > /etc/rsyncd.conf
        uid = nobody
        gid = nobody
        use chroot = no
        read only = yes
        [distribution]
          path = /var/lib/distd
          comment = svc.plus Unified Distribution Mirror
        EOF
        exec rsync --daemon --no-detach --config=/etc/rsyncd.conf

volumes:
  distd-data:
